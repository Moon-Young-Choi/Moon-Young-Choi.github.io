name: Portfolio browser geometry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-unit-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static portfolio
        run: npm run build

      - name: Run unit and rendered-output tests
        run: node --experimental-strip-types --test tests/arbitrage-showcase.test.mjs tests/arbitrage-universe.test.mjs tests/eventedge-demo.test.mjs tests/project-evidence.test.mjs tests/pwr-theory.test.mjs tests/pwr-empirical.test.mjs tests/rendered-html.test.mjs tests/triangle-route-graphic.test.mjs

      - name: Check deterministic PWR empirical artifact
        run: npm run sync:pwr-empirical:check

      - name: Check deterministic EventEdge artifact
        run: npm run check:eventedge-demo

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser geometry tests
        run: npm run test:browser:built
